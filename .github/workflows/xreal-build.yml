name: Build Retro XREAL Walk

on:
  push:
    branches:
      - chatgpt-xreal-walk-build-20260828
    paths:
      - 'xreal-build/**'
      - '.github/workflows/xreal-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore generated source project
        shell: bash
        run: |
          mkdir -p build-work
          cat xreal-build/source.part.* > build-work/source.b64
          base64 -d build-work/source.b64 > build-work/source.zip
          cd build-work
          unzip -q source.zip

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p build-work/Retro_XREAL_Walk_Source :app:assembleDebug --stacktrace

      - name: Assemble requested ZIP contents
        shell: bash
        run: |
          mkdir -p deliverable/SOURCE
          cp -R build-work/Retro_XREAL_Walk_Source/. deliverable/SOURCE/
          cp build-work/Retro_XREAL_Walk_Source/app/build/outputs/apk/debug/app-debug.apk deliverable/Retro_XREAL_Walk-v0.1-debug.apk
          rm -rf deliverable/SOURCE/app/build deliverable/SOURCE/.gradle
          cat > deliverable/INSTALL.txt <<'TXT'
          RETRO XREAL WALK v0.1

          Install Retro_XREAL_Walk-v0.1-debug.apk on the Android phone.
          Connect the original XREAL Air, open the app, grant USB permission,
          face treadmill-forward, tap RECENTER HEAD, set MPH, then START WALK.

          This is a debug-signed prototype APK intended for sideload testing.
          TXT

      - name: Upload source plus APK
        uses: actions/upload-artifact@v4
        with:
          name: Retro_XREAL_Walk_v0.1_SOURCE_AND_APK
          path: deliverable/*
          if-no-files-found: error
          retention-days: 7
